[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h2lm"
version = "0.2.0"
description = "H2LM V1 - Vietnamese legal document vision-language model research code"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
model = ["torch>=2.3"]
tokenizer = ["sentencepiece==0.2.1"]
public_seed = ["sentencepiece==0.2.1", "pypdf==5.9.0"]
scan = ["pypdfium2==5.8.0", "Pillow==12.3.0"]
dev = ["pytest>=8.0,<10", "ruff==0.16.9"]

[project.scripts]
h2lm-tokenizer = "h2lm.tokenization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
