name: H2LM CI

on:
  push:
    branches: [main, 'h2lm-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: h2lm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokenizer:
    name: tokenizer-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU tokenizer tools only
        run: python -m pip install -e '.[tokenizer,public_seed,scan,dev]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Tokenizer contract tests
        run: python -m pytest -q tests/test_m1_tokenizer.py tests/test_m1b_preparation.py tests/test_m1b_benchmark.py tests/test_m1b2_public_seed.py tests/test_scan_input.py --junitxml=artifacts/tokenizer-tests.xml
      - name: Train and evaluate synthetic fixture
        run: python scripts/tokenizer_demo.py --output artifacts/tokenizer-ci
      - name: Prepare corpus and compare tokenizer candidates (synthetic only)
        run: python scripts/corpus_benchmark_demo.py --output artifacts/corpus-benchmark-ci
      - name: Prepare synthetic rescans (not genuine scanner acceptance)
        run: python -m h2lm.scans.cli --demo --page-count 8 --output artifacts/scan-demo
      - name: Archive exact editable source
        run: python -c "import subprocess; subprocess.run(['git', 'archive', '--format=zip', '--output=artifacts/H2LM-Source.zip', 'HEAD'], check=True)"
      - name: Save fixture artifacts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2lm-m1-fixture-${{ matrix.os }}
          path: artifacts/
          retention-days: 7

  model:
    name: model-cpu-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested CPU PyTorch
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e '.[tokenizer,public_seed,scan,dev]'
      - name: All regression and token-to-model integration tests
        run: python -m pytest -q --junitxml=artifacts/all-tests.xml
      - name: Save regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2lm-m1-model-cpu-tests
          path: artifacts/
          retention-days: 7
