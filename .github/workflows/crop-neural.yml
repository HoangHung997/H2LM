name: H2LM Crop Generalization Experiment
on:
  pull_request:
    paths:
      - 'src/h2lm/experiments/crop2_*.py'
      - 'src/h2lm/experiments/scan_adapt.py'
      - 'configs/training/crop_v2.yaml'
      - 'tests/test_crop_v2.py'
      - '.github/workflows/crop-neural.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crop-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train-cpu:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded CPU experiment dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[scan,dev]'
      - name: Regression tests
        run: python -m pytest -q tests/test_crop_v2.py --junitxml=artifacts/crop-tests.xml
      - name: Train from random weights and evaluate unseen field values
        run: python -u -m h2lm.experiments.crop2_train --output artifacts/crop-v2
      - name: Validate optimization and archive exact source
        run: |
          python -c "import json,pathlib; p=pathlib.Path('artifacts/crop-v2/run'); r=json.loads((p/'report-001800.json').read_text()); assert r['completed_steps'] and r['weights_changed'] and r['reload_matches']; assert r['final_train64_nll'] < r['initial_train64_nll']; ref=json.loads((p/'latest.json').read_text()); [f.unlink() for f in p.glob('step-*.pt') if f.name != ref['file']]"
          git rev-parse HEAD > artifacts/crop-v2/source-sha.txt
          git archive --format=zip --output=artifacts/crop-v2/H2LM-source.zip HEAD
      - name: Save actual checkpoint and predictions; not a quality approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2lm-crop-generalization-cpu
          path: artifacts/
          retention-days: 7
